name: Benchmark

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # run.sh needs full history for worktrees

      - uses: leanprover/lean-action@v1
        with:
          build-args: "prim-parser"

      - name: Install hyperfine
        run: sudo apt-get update && sudo apt-get install -y hyperfine

      - name: Run benchmarks (single ref = HEAD)
        run: bench/run.sh HEAD -

      - uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/results/
